name: release

# Push a tag like v0.3.1 to test, build the search-only package and publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check tag matches package version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != pyproject version $version" }

      - name: Test
        run: |
          uv run python scripts/bundle.py fetch
          uv run --extra test pytest -q -p no:cacheprovider --basetemp="$env:RUNNER_TEMP/fs-test"

      - name: Build search-only package
        run: uv run python scripts/bundle.py searchonly

      - name: Install and self-check the package as a user would
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'unzipped'
          Expand-Archive dist/Fastsearch-MCP-Share.zip -DestinationPath $pkg
          $root = Join-Path $pkg 'Fastsearch-MCP-Share'
          & (Join-Path $root '01-install.ps1')
          & (Join-Path $root '.venv/Scripts/python.exe') (Join-Path $root 'check.py')
          if ($LASTEXITCODE -ne 0) { throw 'check.py failed' }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Fastsearch-MCP-Share.zip --title "${{ github.ref_name }}" --generate-notes
