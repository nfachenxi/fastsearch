name: release

# Version-driven releases: every push to main publishes a GitHub Release for the
# version in pyproject.toml unless that version is already released. To release,
# bump the version (pyproject.toml and src/fastsearch_mcp/__init__.py) and push.
# Versions ending in aN / bN / rcN / devN are published as pre-releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Decide whether this version needs a release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $init = Get-Content -Raw src/fastsearch_mcp/__init__.py
          if ($init -notmatch "__version__ = `"$([regex]::Escape($version))`"") {
            throw "src/fastsearch_mcp/__init__.py does not match pyproject version $version"
          }
          $tag = "v$version"
          gh release view $tag --json tagName *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          $pre = $version -match '(a|b|rc|dev)\d*$'
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "needed=$((-not $exists).ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($exists) { "$tag is already released; nothing to do." } else { "Releasing $tag (prerelease: $pre)." }

      - uses: astral-sh/setup-uv@v7
        if: steps.version.outputs.needed == 'true'
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Test
        if: steps.version.outputs.needed == 'true'
        run: |
          uv run python scripts/bundle.py fetch
          uv run --extra test pytest -q -p no:cacheprovider --basetemp="$env:RUNNER_TEMP/fs-test"

      - name: Build search-only package
        if: steps.version.outputs.needed == 'true'
        shell: pwsh
        run: |
          uv run python scripts/bundle.py searchonly
          $hash = (Get-FileHash dist/Fastsearch-MCP-Share.zip -Algorithm SHA256).Hash.ToLower()
          # LF line ending so `sha256sum -c` also works on Linux/macOS.
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/Fastsearch-MCP-Share.zip.sha256'), "$hash  Fastsearch-MCP-Share.zip`n")
          Get-Content dist/Fastsearch-MCP-Share.zip.sha256

      - name: Install and self-check the package as a user would
        if: steps.version.outputs.needed == 'true'
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'unzipped'
          Expand-Archive dist/Fastsearch-MCP-Share.zip -DestinationPath $pkg
          $root = Join-Path $pkg 'Fastsearch-MCP-Share'
          & (Join-Path $root '01-install.ps1')
          & (Join-Path $root '.venv/Scripts/python.exe') (Join-Path $root 'check.py')
          if ($LASTEXITCODE -ne 0) { throw 'check.py failed' }

      - name: Publish GitHub Release
        if: steps.version.outputs.needed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $notes = @"
          纯搜索部署版：下载 **Fastsearch-MCP-Share.zip**，解压到固定目录，按包内 README.md 运行 01-install.ps1，或把包内 AI-INSTALL.md 交给有终端权限的 AI 助手。需要 Windows x64、Python 3.10+ 和 uv；已附带 fd、ripgrep、ilspycmd。

          校验：``Get-FileHash Fastsearch-MCP-Share.zip -Algorithm SHA256`` 的结果应与 Fastsearch-MCP-Share.zip.sha256 一致。
          "@
          $flags = @()
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release create $env:TAG dist/Fastsearch-MCP-Share.zip dist/Fastsearch-MCP-Share.zip.sha256 `
            --target $env:GITHUB_SHA --title "fastsearch $env:TAG" --notes $notes --generate-notes @flags
